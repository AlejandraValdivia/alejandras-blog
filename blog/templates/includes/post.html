{% load static %}
<li>
  <article class="post">
    <a id="post-title" href="{% url 'post-detail-page' post.slug %}"
      >{{ post.title }}</a
    >
    <img src="{{ post.image.url }}" alt="{{ post.title }}" />
    <div class="post__content">
      <p id="post-date">{{ post.date }}</p>
      <h4>
        <em><a href="mailto:alexvcodes@gmail.com">{{ post.author }}</a></em>
      </h4>
      <p>{{ post.excerpt }}</p>
    </div>
    <div id="form-actions">
      <a id="button" href="{% url 'post-detail-page' post.slug %}">View</a>
    </div>
  </article>
</li>
