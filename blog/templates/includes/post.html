{% load static %}
<li>
    <article class="post">
    <a id="post-title" href="{% url 'post-detail-page' post.slug %}">{{ post.title }}</a>
    <img src="{{ post.image.url }}" alt="{{ post.title }}"/>
    <div class="post__content">
        <p id="post-date">{{ post.date }}</p>
        <h4><em><a href="mailto:alexvcodes@gmail.com">{{ post.author }}</a></em></h4>
        <p>{{ post.excerpt }}</p>
    </div>
    <a id="form-actions" href="{% url 'post-update-page' slug=post.slug %}">Edit Post</a>
    <a id="form-actions" href="{% url 'post-delete-page' slug=post.slug %}">Delete</a>
    </article>
  </li>
